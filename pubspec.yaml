name: bullcare_bib
description: "Aplikasi manajemen pemeliharaan bull Balai Inseminasi Buatan (BIB)."
publish_to: 'none'
version: 1.6.0+7

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  pdf: ^3.12.0
  archive: ^4.0.9
  file_saver: ^0.3.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

